<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17201C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crafers Fin">
<title>Crafers Fin · касса и учёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F2EC; --surface:#FFFFFF; --soft:#FAF9F5; --tint:#EAE6DA; --line:#E3E0D6; --line2:#EFECE3;
  --ink:#1B1D1A; --muted:#5E625B; --green:#1F5E4A; --green-soft:#E3EFE8; --amber:#D9A441;
  --amber-soft:#F5EAD6; --amber-ink:#7A4A12; --warn:#8A3B0A; --warn-soft:#F5E1D2; --side:#17201C;
  --font:'Onest','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- каркас ---------- */
.app{display:flex;height:100%;height:100dvh}
.side{width:248px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;gap:20px;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--amber);color:var(--side);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.brand b{display:block;font-size:17px}
.brand small{color:#93A39A;font-size:12px}
.side nav{display:flex;flex-direction:column;gap:2px}
.group{color:#7F8F86;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:12px 14px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:#B9C4BE;font-size:14px;font-weight:500;text-align:left}
.nav:hover{background:#26332D;color:#fff}
.nav.on{background:#2E4038;color:#fff;font-weight:600}
.nav svg,.tab svg{flex-shrink:0}
.pill{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--amber);color:var(--side);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.close{margin-top:auto;background:#212C27;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#B9C4BE}
.close b{color:#fff;font-size:14px}
.bar{height:6px;background:#33413A;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:64%;background:var(--amber)}

.body{flex:1;display:flex;flex-direction:column;min-width:0}
.top{min-height:64px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{font-size:14px;color:var(--muted)}
.crumbs b{color:var(--ink)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;height:40px;width:250px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.search input{border:0;outline:0;background:transparent;font-size:14px;flex:1;min-width:0}
.chipbtn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
main{flex:1;overflow:auto;padding:28px;-webkit-overflow-scrolling:touch}
.page{display:flex;flex-direction:column;gap:18px;max-width:1280px}

/* ---------- элементы ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:700;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:14px;font-weight:600}
.btn:hover{filter:brightness(.92)}
.btn.sm{height:34px;padding:0 12px;border-radius:8px;font-size:13px}
.btn.amber{background:var(--amber);color:var(--side)}
.ghost{height:44px;padding:0 16px;border:1px solid #D6D2C4;border-radius:10px;background:var(--surface);font-size:14px}
.ghost:hover{background:#ECE8DD}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:20px 22px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.kpi:hover{background:var(--soft)}
.kpi span:first-child{color:var(--muted);font-size:13px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.5px}
.kpi small{font-size:13px}
.kpi.dark{background:var(--green);color:#fff;border-color:var(--green)}
.kpi.dark span:first-child{color:#D8E6DE}
.seg{display:flex;background:var(--tint);border-radius:10px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D6D2C4;background:#fff;font-size:13px;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-wait{background:var(--amber-soft);color:var(--amber-ink)}
.b-bad{background:var(--warn-soft);color:var(--warn)}
.b-none{background:var(--line2);color:var(--muted)}

/* финансовые таблицы (P&L, ДДС) */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
table{border-collapse:collapse;width:100%}
.fin{min-width:760px;font-size:14px}
.fin th{background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:12px 16px;text-align:right;white-space:nowrap}
.fin th:first-child{text-align:left}
.fin td{padding:11px 16px;border-top:1px solid var(--line2);text-align:right;white-space:nowrap;background:#fff}
.fin td:first-child{text-align:left;white-space:normal;min-width:220px}
.fin th:first-child,.fin td:first-child{position:sticky;left:0;z-index:1}
.fin tr.indent td:first-child{padding-left:34px}
.fin tr.subt td{font-weight:600}
.fin tr.total td{background:#F1EEE5;font-weight:700}
.fin tr.grand td{background:var(--green);color:#fff;font-weight:700}
.fin tr.grand td.p{color:#D8E6DE}
.fin tr.hd td{background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:9px 16px}
.fin tr.link{cursor:pointer}
.fin tr.link:hover td{background:#F7F5EF}
.fin tr.link td:first-child::after{content:"  ›";color:var(--green);font-weight:700}
.fin td.p{color:var(--muted)}
.fin td.bad{color:var(--warn);font-weight:600}
.fin td.good{color:var(--green)}

/* списки (превращаются в карточки на телефоне) */
.list{font-size:14px}
.list th{background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:12px 16px;text-align:left;white-space:nowrap}
.list td{padding:13px 16px;border-top:1px solid var(--line2);vertical-align:middle}
.list .r{text-align:right}
.list tr.click{cursor:pointer}
.list tr.click:hover td{background:#F7F5EF}
.list .two small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.foot{display:flex;justify-content:flex-end;gap:16px;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft);font-size:14px;border-radius:0 0 14px 14px}

/* сводка */
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.chart{height:200px;display:flex;align-items:flex-end;gap:14px;padding:0 4px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;height:190px}
.chart .col i{display:block;width:min(26px,40%);border-radius:6px 6px 2px 2px}
.months{display:flex;gap:14px;padding:6px 4px 0}
.months span{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.meter{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--green)}
.task{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;border:0;border-top:1px solid var(--line2);background:#fff;text-align:left}
.task:hover{background:#F7F5EF}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.task .t{flex:1;display:flex;flex-direction:column;gap:2px}
.task .t small{color:var(--muted);font-size:13px}
.task .go{font-size:13px;color:var(--green);font-weight:600;white-space:nowrap}


.form{border:1px solid var(--green)}
.fgrid{display:grid;grid-template-columns:1fr 1.4fr 180px;gap:14px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
label.fld input{height:44px;padding:0 12px;border:1px solid #D6D2C4;border-radius:10px;font-size:16px;color:var(--ink);background:#fff;width:100%}
.expwrap{display:flex;gap:16px;align-items:flex-start}
.expwrap>.card:first-child{flex:1;min-width:0}
.limits{width:320px;flex-shrink:0}


.toast{position:fixed;right:24px;bottom:24px;background:var(--side);color:#fff;padding:14px 18px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:10px;z-index:50;max-width:calc(100vw - 32px);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* нижняя навигация и «Ещё» — только телефон */
.tabs,.sheet,.scrim{display:none}

/* первая версия */
.abar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--green-soft);color:var(--green);font-size:13px}
.abar>b{font-weight:600;margin-right:4px}
.atag{display:inline-flex;align-items:center;min-height:26px;padding:3px 10px;border-radius:13px;background:#fff;border:1px solid #C9DDD2;color:var(--ink);font-size:12px;line-height:1.3}
.atag i{font-style:normal;font-weight:700;color:var(--green);margin-right:5px}
.abar button{margin-left:auto;height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--amber);color:var(--side);font-weight:600;font-size:12px;white-space:nowrap}
.nav.later{opacity:.6}
.fchart{position:relative}
.plist{min-width:300px}
.minline{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);opacity:.55;pointer-events:none}
.act-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:13px;color:var(--muted)}
.act-sign span{border-top:1px solid var(--line);padding-top:28px}
.sheet{max-height:85vh;overflow-y:auto}
/* анкета */
.intro{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px 22px;border-radius:14px;background:var(--side);color:#fff}
.intro p{margin:6px 0 0;color:#C9D3CD;font-size:14px;line-height:1.5;max-width:760px}
.intro .btn{background:var(--amber);color:var(--side)}
.intro .ghost{color:var(--ink);border-color:transparent}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qblock{scroll-margin-top:8px;overflow:hidden}
.qnote{margin:12px 22px 6px;padding:12px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--line2);font-size:13px;color:var(--muted);line-height:1.5}
.qnote b{color:var(--ink);font-weight:600}
.q{padding:16px 22px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.q .qt{font-size:15px;font-weight:600;line-height:1.4}
.q .qh{font-size:13px;color:var(--muted);margin-top:-4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;border:1px solid #D6D2C4;border-radius:10px;background:#fff;font-size:14px;line-height:1.3;cursor:pointer}
.opt input{accent-color:var(--green);width:16px;height:16px;margin:0;flex-shrink:0}
.opt:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.qin{width:100%;min-height:44px;padding:10px 12px;border:1px solid #D6D2C4;border-radius:10px;font:inherit;font-size:15px;color:var(--ink);background:#fff;resize:vertical}
.qin.c{min-height:38px;padding:7px 12px;font-size:14px;border-style:dashed}
.qprog{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.qprog i{display:block;height:100%;width:0;background:var(--green);border-radius:4px}

@media (max-width: 1100px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .expwrap{flex-direction:column}
  .limits{width:100%}
  .search{display:none}
}

@media (max-width: 760px){
  .side{display:none}
  .top{padding:0 16px;padding-top:env(safe-area-inset-top,0px);min-height:calc(56px + env(safe-area-inset-top,0px))}
  .top .chipbtn.org,.top .chipbtn.period{display:none}
  .crumbs{font-size:17px}
  .crumbs .path{display:none}
  main{padding:16px 14px calc(88px + env(safe-area-inset-bottom,0px))}
  h1{font-size:22px}
  .head{align-items:flex-start}
  .actions{width:100%}
  .actions .btn,.actions .ghost{flex:1}
  .actions .seg{width:100%}
  .actions .seg button{flex:1}
  .grid4{gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:20px}
  .fgrid{grid-template-columns:1fr}
  .pad{padding:16px}
  .toast{left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .fgrid2{grid-template-columns:1fr}
  .qnote{margin-left:16px;margin-right:16px}
  .intro{padding:16px}
  .list td.plist{display:block;text-align:left;min-width:0}
  .list td.plist::before{display:block;margin-bottom:4px}
  .intro .btn{width:100%}

  /* списки как карточки */
  .list thead{display:none}
  .list,.list tbody,.list tr,.list td{display:block;width:100%}
  .list tr{padding:12px 16px;border-top:1px solid var(--line2)}
  .list tr:first-child{border-top:0}
  .list td{border:0;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .list td::before{content:attr(data-label);color:var(--muted);font-size:13px;text-align:left}
  .list td.main{display:block;text-align:left;padding-bottom:6px;font-size:15px}
  .list td.main::before{display:none}
  .list td.hide-m{display:none}

  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:500;padding:6px 0;min-height:52px;position:relative}
  .tab.on{color:var(--green);font-weight:700}
  .tab .pill{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;font-size:11px}
  .scrim{position:fixed;inset:0;background:rgba(23,32,28,.4);z-index:45}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:46;background:#fff;border-radius:18px 18px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:2px}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
  .sheet .nav{color:var(--ink);height:52px;font-size:16px}
  .sheet .nav.on{background:var(--green-soft);color:var(--green)}
  .more-open .scrim{display:block}
  .more-open .sheet{display:flex}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

/* приложение версии 0 */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
label.fld select,label.fld textarea{font-size:15px}
select.qin{height:44px;padding:0 10px;appearance:auto}
.msel{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:0 2px;max-width:170px}
.msg{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.45}
.msg.ok{background:var(--green-soft);color:var(--green)}
.msg.warn{background:var(--amber-soft);color:var(--amber-ink)}
.msg.bad{background:var(--warn-soft);color:var(--warn)}
.msg b{font-weight:600}
.msg .actions{margin-top:4px}
.linkbtn{border:0;background:transparent;padding:0;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chipbtn select,.chipbtn input{height:32px}
.sheet{max-height:85vh;overflow-y:auto}
@media (max-width: 1100px){ .split3{grid-template-columns:1fr} }
</style>
<script src="xlsx.full.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="logo">CF</div><div><b>Crafers Fin</b><small>Касса и учёт · версия 0</small></div></div>
    <nav id="sidenav" aria-label="Разделы"></nav>
    <div class="close" id="sidebox"></div>
  </aside>
  <div class="body">
    <header class="top">
      <div class="crumbs"><span class="path">Crafers Fin / </span><b id="crumb">Касса</b></div>
      <div class="spacer"></div>
      <label class="chipbtn period">Месяц отчётов <select id="month" class="msel" aria-label="Месяц отчётов"></select></label>
      <button class="chipbtn" id="bkbtn" type="button" data-go="data"></button>
    </header>
    <main id="main"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <div class="scrim" data-act="more-close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Другие разделы"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================= хранилище ================= */
const KEY='crafersfin.app.v1';
const ARTS0=[
  ['in_client','Оплата от клиентов','in','client','none'],
  ['in_podret','Возврат неиспользованного подотчёта','in','pod_return','employee'],
  ['in_owner','Вклад учредителей','in','equity_in','none'],
  ['in_loan','Займ получен','in','loan_in','none'],
  ['in_other','Прочие поступления','in','other_in','none'],
  ['out_sup','Оплата поставщику','out','supplier','supplier'],
  ['out_salary','Зарплата и аванс','out','salary','employee'],
  ['out_pod','Выдача под отчёт','out','pod_issue','employee'],
  ['out_fuel','ГСМ','out','direct','car'],
  ['out_repair','Ремонт машин','out','direct','car'],
  ['out_bonus','Бонусы и акции клиентам','out','bonus','none'],
  ['out_rent','Аренда','out','expense','none'],

const grp=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,'\u202F');

const mln=n=>{ const v=Math.round(Math.abs(n||0)/1e5)/10, p=v.toFixed(1).split('.'); const s=grp(p[0])+','+p[1]; return n<0&&v!==0?'−'+s:s; };
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+(typeof f==='function'?f(x):x[f]),0);
function parseSum(v){
  if(typeof v==='number') return isFinite(v)?Math.round(v):NaN;
  let s=String(v==null?'':v).replace(/сум|so['‘’]?m|uzs/gi,'').replace(/[\s\u00A0\u202F']/g,'');
  let neg=false; const pm=s.match(/^\((.*)\)$/); if(pm){ neg=true; s=pm[1]; }
  if(s[0]==='-'||s[0]==='−'){ neg=!neg; s=s.slice(1); }
  if(s.indexOf('.')>=0&&s.indexOf(',')>=0){ const dec=s.lastIndexOf('.')>s.lastIndexOf(',')?'.':','; s=s.split(dec==='.'?',':'.').join('').replace(',','.'); }
  else if(/^\d{1,3}([.,]\d{3})+$/.test(s)) s=s.replace(/[.,]/g,'');
  else s=s.replace(',','.');

}
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

/* ================= расчёты: одна логика на все отчёты ================= */
function inRange(x,f,t){ return x.date>=f&&x.date<=t; }
function cashAt(d){ return DB.opening.cash+sum(DB.ops.filter(o=>o.date<=d),o=>o.dir==='in'?o.sum:-o.sum); }
function cashBefore(d){ return DB.opening.cash+sum(DB.ops.filter(o=>o.date<d),o=>o.dir==='in'?o.sum:-o.sum); }
function supBal(id,d){
  return (+DB.opening.sup[id]||0)+sum(DB.inv.filter(x=>x.sup===id&&x.date<=d),'sum')-sum(DB.ops.filter(o=>o.party===id&&A(o.art).kind==='supplier'&&o.date<=d),'sum');
}
function podBal(id,d){
  const k=o=>A(o.art).kind;
  return (+DB.opening.pod[id]||0)+sum(DB.ops.filter(o=>o.party===id&&k(o)==='pod_issue'&&o.date<=d),'sum')
    -sum(DB.ops.filter(o=>o.party===id&&k(o)==='pod_return'&&o.date<=d),'sum')-sum(DB.podc.filter(x=>x.emp===id&&x.date<=d),'sum');
}
function plCalc(f,t){
  const st=P(f), vr=st.vatRate/100;
  const sl=DB.sales.filter(x=>inRange(x,f,t));
  const G=sum(sl,'sum'), R=sum(sl,'ret'), S=G-R;
  const N0=st.salesVat?S/(1+vr):S, vat=st.salesVat?S-N0:0;
  const ops=DB.ops.filter(o=>inRange(o,f,t)), pc=DB.podc.filter(x=>inRange(x,f,t));
  const k=o=>A(o.art).kind;
  const lines={};
  ops.filter(o=>k(o)==='direct'||k(o)==='expense').concat(pc).forEach(o=>{ lines[o.art]=(lines[o.art]||0)+o.sum; });
  const direct=sum(Object.keys(lines).filter(id=>A(id).kind==='direct'),id=>lines[id]);
  const expense=sum(Object.keys(lines).filter(id=>A(id).kind==='expense'),id=>lines[id]);
  const sal=ops.filter(o=>k(o)==='salary');
  const grpOf=o=>{ if(o.grp) return o.grp; const e=DB.employees.find(x=>x.id===o.party); return e?e.group:'office'; };
  const salD=sum(sal.filter(o=>grpOf(o)==='direct'),'sum'), salO=sum(sal.filter(o=>grpOf(o)!=='direct'),'sum');
  const bonus=sum(ops.filter(o=>k(o)==='bonus'),'sum'), ptax=sum(ops.filter(o=>k(o)==='payroll_tax'),'sum'), otherIn=sum(ops.filter(o=>k(o)==='other_in'),'sum');
  const net=N0-bonus, cogs=N0*st.cogsPct/100, gross=net-cogs-direct-salD, opex=salO+ptax+expense, ebitda=gross-opex, pbt=ebitda+otherIn;
  const ctax=Math.max(0,pbt)*st.ctax/100, np=pbt-ctax;
  const invG=sum(DB.inv.filter(x=>inRange(x,f,t)),'sum'), invNet=st.purchVat?invG/(1+vr):invG, vatIn=invG-invNet;
  return {G,R,S,N0,vat,rec:S,bonus,cogs,lines,direct,expense,salD,salO,ptax,otherIn,net,gross,opex,ebitda,pbt,ctax,np,invG,invNet,vatIn};
}
function periodsTo(d){
  const s=DB.settings.startDate; if(d<s) return [];
  return monthsBetween(s,d).map(m=>{ const r=monthRange(m); return [r[0]<s?s:r[0], r[1]>d?d:r[1]]; });
}
function openingEquity(){
  const O=DB.opening; let debt=0, adv=0;
  Object.keys(O.sup).forEach(id=>{ const v=+O.sup[id]||0; if(v>0) debt+=v; else adv-=v; });
  const pod=sum(Object.keys(O.pod),id=>+O.pod[id]||0);
  return O.cash+O.clients+O.goods+pod+adv+O.fixed-(debt+O.loans+O.vat+O.ctax);
}
function balance(d){
  const O=DB.opening, k=o=>A(o.art).kind;
  let rec=0,cogs=0,invNet=0,vatNet=0,ctax=0,np=0;
  periodsTo(d).forEach(p=>{ const c=plCalc(p[0],p[1]); rec+=c.rec; cogs+=c.cogs; invNet+=c.invNet; vatNet+=c.vat-c.vatIn; ctax+=c.ctax; np+=c.np; });
  const ops=DB.ops.filter(o=>o.date<=d), by=kind=>sum(ops.filter(o=>k(o)===kind),'sum');
  const cash=cashAt(d), clients=O.clients+rec-by('client'), goods=O.goods+invNet-cogs;
  const pod=sum(Object.keys(O.pod),id=>+O.pod[id]||0)+by('pod_issue')-by('pod_return')-sum(DB.podc.filter(x=>x.date<=d),'sum');
  const ids={}; DB.suppliers.forEach(s=>ids[s.id]=1); Object.keys(O.sup).forEach(id=>ids[id]=1);
  let supDebt=0, supAdv=0; Object.keys(ids).forEach(id=>{ const b=supBal(id,d); if(b>0) supDebt+=b; else supAdv-=b; });
  const loans=O.loans+by('loan_in')-by('loan_out'), vat=O.vat+vatNet-by('vat_pay'), ctaxL=O.ctax+ctax-by('ctax_pay');
  const As=cash+clients+goods+pod+supAdv+O.fixed, Ls=supDebt+loans+vat+ctaxL, eq=As-Ls;
  const eqCalc=openingEquity()+np+by('equity_in')-by('equity_out');
  return {cash,clients,goods,pod,supAdv,fixed:O.fixed,A:As,supDebt,loans,vat,ctax:ctaxL,L:Ls,eq,eqCalc,np};
}

/* ================= проверки ввода кассы ================= */
function dayClosed(d){ return !!(DB.days[d]&&DB.days[d].closed); }
function lastClosed(){ return Object.keys(DB.days).filter(dayClosed).sort().pop()||''; }
/* первый день, на конец которого касса уходит в минус, для заданного списка операций */
function firstNegative(list){
  const days={}; list.forEach(o=>{ days[o.date]=(days[o.date]||0)+(o.dir==='in'?o.sum:-o.sum); });
  let b=DB.opening.cash;
  for(const d of Object.keys(days).sort()){ b+=days[d]; if(b<0) return {d:d,b:b}; }
  return null;
}
function podFirstNeg(emp,ops,podc){
  const ev={}, add=(d,v)=>{ ev[d]=(ev[d]||0)+v; };
  ops.forEach(o=>{ if(o.party!==emp) return; const k=A(o.art).kind; if(k==='pod_issue') add(o.date,o.sum); else if(k==='pod_return') add(o.date,-o.sum); });
  podc.forEach(x=>{ if(x.emp===emp) add(x.date,-x.sum); });
  let b=+DB.opening.pod[emp]||0;
  for(const d of Object.keys(ev).sort()){ b+=ev[d]; if(b<0) return {d:d,b:b}; }
  return null;
}
function validateOp(o,editId){
  const errs=[], warns=[], st=DB.settings, a=A(o.art);
  if(!o.date) errs.push('Укажите дату.');
  else{
    if(o.date>today()) errs.push('Дата в будущем. Операцию вносят в день, когда деньги прошли через кассу.');
    if(o.date<st.startDate) errs.push('Дата раньше начала учёта '+dmy(st.startDate)+'.');
    if(dayClosed(o.date)) errs.push('День '+dmy(o.date)+' закрыт. Сначала откройте его в разделе «Закрытие дня» с указанием причины.');
    else if(o.date<lastClosed()) errs.push('Уже закрыт более поздний день '+dmy(lastClosed())+'. Операция задним числом изменила бы его остаток.');
  }
  if(editId){ const old=DB.ops.find(x=>x.id===editId); if(old&&(dayClosed(old.date)||old.date<lastClosed())) errs.push('Исходный день операции уже закрыт.'); }
  if(!o.art) errs.push('Выберите статью.');
  if(a.need!=='none'&&!o.party) errs.push('Выберите: '+NEED_LABEL[a.need].toLowerCase()+'.');
  if(!(o.sum>0)) errs.push('Сумма должна быть числом больше нуля.');
  if(String(o.note||'').trim().length<3) errs.push('Заполните «Назначение»: без него операцию потом не проверить.');
  if(errs.length) return {errs,warns};
  const rest=DB.ops.filter(x=>x.id!==editId), neg=firstNegative(rest.concat([o]));
  if(neg){
    if(o.dir==='out'&&neg.d===o.date){ const avail=DB.opening.cash+sum(rest.filter(x=>x.date<=o.date),x=>x.dir==='in'?x.sum:-x.sum); errs.push('В кассе на '+dmy(o.date)+' только '+fmt(avail)+' сум. Проверьте сумму или сначала внесите приход.'); }
    else errs.push('После этого касса уйдёт в минус на конец '+dmy(neg.d)+': '+fmt(neg.b)+' сум. Проверьте сумму.');
  }
  if(o.dir==='out'&&a.kind==='supplier'){ const old=editId?DB.ops.find(x=>x.id===editId):null; const b=supBal(o.party,o.date)+(old&&old.party===o.party&&A(old.art).kind==='supplier'&&old.date<=o.date?old.sum:0); if(o.sum>b&&b>=0) warns.push('Мы должны этому поставщику '+fmt(b)+' сум, а платим '+fmt(o.sum)+'. Разница станет авансом. Если это оплата накладной, сначала внесите её в «Приход товара».'); }
  { const old=editId?DB.ops.find(x=>x.id===editId):null, emps={};
    if(a.kind==='pod_issue'||a.kind==='pod_return') emps[o.party]=1;
    if(old&&(A(old.art).kind==='pod_issue'||A(old.art).kind==='pod_return')) emps[old.party]=1;
    Object.keys(emps).forEach(e=>{ const pn=podFirstNeg(e,rest.concat([o]),DB.podc); if(pn) errs.push('Под отчётом у сотрудника '+nameOf('employees',e)+' будет минус на конец '+dmy(pn.d)+': '+fmt(pn.b)+' сум.'); }); }
  if(editId&&String(o.why||'').trim().length<3) errs.push('Укажите причину исправления.');
  if(o.sum>=1e9) warns.push('Сумма больше миллиарда сум. Проверьте, нет ли лишних нулей.');
  if(o.dir==='out'&&o.sum>st.bigLimit) warns.push('Крупный расход: больше '+fmt(st.bigLimit)+' сум. Он попадёт в список на проверку финансовому директору.');
  const dup=DB.ops.find(x=>x.id!==editId&&x.date===o.date&&x.art===o.art&&x.sum===o.sum&&(x.party||'')===(o.party||''));
  if(dup) warns.push('Такая же операция уже есть в этот день: '+esc(dup.note)+'. Проверьте, не вносите ли второй раз.');
  return {errs,warns};
}

function idb(fn){ return new Promise((res,rej)=>{ const r=indexedDB.open('crafersfin',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ const tx=r.result.transaction('kv','readwrite'); const q=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(q&&q.result); tx.onerror=()=>rej(tx.error); }; r.onerror=()=>rej(r.error); }); }
let FH=null, fhOk=false, bkTimer=null, STALE=null;

  }catch(e){ if(e&&e.name!=='AbortError') toast('Не получилось подключить файл: '+e.message); }

    if(validCopy(d)&&d.lastBackup&&(!DB.lastBackup||d.lastBackup>DB.lastBackup)&&d.log.length>DB.log.length){ STALE=d; fhOk=false; } }catch(e){}
}

function takeStale(){ if(!STALE) return; DB=STALE; STALE=null; fhOk=true; if(!Array.isArray(DB.params)||!DB.params.length) DB.params=blank().params; DB.saleKeys={}; log('Данные взяты из файла копии','в файле были более свежие данные'); persist(); writeBackup(); render(false); toast('Данные взяты из файла копии'); }
async function writeBackup(){

  try{ DB.lastBackup=new Date().toISOString(); const w=await FH.createWritable(); await w.write(JSON.stringify(DB)); await w.close(); }
  catch(e){ fhOk=false; renderTop(); return false; }
  persist(); renderTop(); return true;
}

function downloadText(name,text,type){

  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
}

function validCopy(d){
  if(!d||d.v!==1||typeof d.settings!=='object'||typeof d.opening!=='object'||typeof d.days!=='object') return false;
  const arrs=['ops','inv','podc','sales','suppliers','employees','cars','customArts','log','imports'];
  if(!arrs.every(k=>Array.isArray(d[k]))) return false;
  const idok=x=>x&&/^[A-Za-z0-9_]+$/.test(String(x.id));
  if(![].concat(d.ops,d.inv,d.podc,d.sales,d.suppliers,d.employees,d.cars,d.customArts).every(idok)) return false;
  if(!d.ops.every(o=>typeof o.sum==='number'&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)&&(o.dir==='in'||o.dir==='out')&&/^[A-Za-z0-9_]*$/.test(String(o.art))&&/^[A-Za-z0-9_]*$/.test(String(o.party||'')))) return false;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.settings.startDate)) return false;
  const num=x=>typeof x==='number'&&isFinite(x);
  if(!num(d.settings.bigLimit)) return false;
  if(d.params!==undefined&&(!Array.isArray(d.params)||!d.params.length||!d.params.every(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.from)&&num(x.vatRate)&&num(x.ctax)&&num(x.cogsPct)))) return false;
  if(!d.sales.every(x=>num(x.sum)&&num(x.ret)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))) return false;
  if(!d.inv.every(x=>num(x.sum)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))||!d.podc.every(x=>num(x.sum)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date))) return false;
  return true;
}

    log('Проведена операция',dmy(o.date)+' · '+(o.dir==='in'?'приход':'расход')+' · '+a.name+' · '+fmt(o.sum));

function guessMap(hdr){

}
/* короткий отпечаток строки выгрузки: хранится вместо самой строки */
function hkey(s){ let h1=0x811c9dc5, h2=5381; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=(Math.imul(h2,33)+c)>>>0; } return h1.toString(36)+h2.toString(36)+s.length.toString(36); }
/* строка-итог: слово «итог» в самой ячейке даты («28.09.2026 Итог», «Общий итог») или ячейка целиком «Итого», «Итог за день» */

const TOT_EXACT=/^\s*(общий\s+итог|итог|итого|всего|total|grand\s+total)(\s+(за|по)\s.*)?\s*[:.]?\s*$/i;
function salesPreview(){
  const I=S.imp, m=I.map, start=DB.settings.startDate;

  if(String(m.date)===String(m.sum)) return {err:'Дата и сумма не могут быть одной колонкой.'};
  const days={}, seen={}, have=new Set(), td=today(); let bad=0, newRows=0, totals=0, future=0, badData=0; const totEx=[], badEx=[];
  DB.sales.forEach(x=>(x.keys||[]).forEach(k=>have.add(k)));
  I.rows.forEach(row=>{
    if(I.skipTotals!==false&&(TOT_WORD.test(String(row[m.date]==null?'':row[m.date]))||row.some(c=>TOT_EXACT.test(String(c==null?'':c))))){ totals++; if(totEx.length<2) totEx.push(row.map(c=>String(c==null?'':c)).filter(Boolean).join(' · ').slice(0,90)); return; }
    const d=cellDate(row[m.date]), s=parseSum(row[m.sum]);
    if(d&&isNaN(s)&&String(row[m.sum]==null?'':row[m.sum]).trim()!==''){ badData++; if(badEx.length<3) badEx.push(dmy(d)+': «'+String(row[m.sum]).slice(0,30)+'»'); return; }
    if(!d||isNaN(s)||s===0){ bad++; return; }
    if(d>td){ future++; return; }
    const isRet=s<0||(m.type!==''&&/возврат/i.test(String(row[m.type]||'')));
    const base=d+'|'+row.map(x=>x instanceof Date?x.toISOString():String(x==null?'':x)).join('¦');
    seen[base]=(seen[base]||0)+1;
    const key=hkey(base+'#'+seen[base]);
    const D=days[d]||(days[d]={date:d,sum:0,ret:0,n:0,dup:0,keys:[],manual:DB.sales.some(x=>x.date===d&&x.src==='вручную'),loaded:DB.sales.some(x=>x.date===d&&x.src==='SalesDoc')});

function readSalesFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const bytes=new Uint8Array(rd.result); let wb;
      const isZip=bytes[0]===0x50&&bytes[1]===0x4B, isOle=bytes[0]===0xD0&&bytes[1]===0xCF&&bytes[2]===0x11&&bytes[3]===0xE0;
      if(!isZip&&!isOle){ let txt=new TextDecoder('utf-8').decode(bytes); if(txt.indexOf('\uFFFD')>=0) txt=new TextDecoder('windows-1251').decode(bytes); wb=XLSX.read(txt.replace(/^\uFEFF/,''),{type:'string',raw:true}); }
      else wb=XLSX.read(bytes,{type:'array',cellDates:true,raw:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      let h=aoa.findIndex(r=>r.filter(c=>typeof c==='string'&&c.trim()).length>=2);
      if(h<0) h=0;
      const header=aoa[h].map(x=>String(x).trim()), rows=aoa.slice(h+1).filter(r=>r.some(c=>String(c).trim()!==''));
      const saved=DB.salesMap, g=guessMap(header);
      let map=g;
      if(saved&&typeof saved.date==='string'){
        const ix=n=>header.indexOf(n), md=ix(saved.date), ms=ix(saved.sum), mt=saved.type?ix(saved.type):-1;
        if(md>=0&&ms>=0) map={date:md,sum:ms,type:mt>=0?mt:''};
      }
      S.imp={file:file.name,header,rows,map:Object.assign({date:'',sum:'',type:''},map)}; render(true);
    }catch(e){ toast('Не удалось прочитать файл: '+e.message); }
  };
  rd.readAsArrayBuffer(file);
}

function exportXlsx(){
  if(!window.XLSX){ toast('Библиотека Excel не загрузилась'); return; }
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);
  add('Касса',[['Дата','Приход/расход','Статья','Контрагент','Сумма','Назначение','Крупный','Исправлено']].concat(DB.ops.slice().sort((a,b)=>a.date<b.date?-1:1).map(o=>[dmy(o.date),o.dir==='in'?'приход':'расход',A(o.art).name,partyName(o),o.sum,o.note,o.big?'да':'',o.edited?'да':''])));
  add('Накладные',[['Дата','Поставщик','Номер','Сумма','Комментарий']].concat(DB.inv.map(x=>[dmy(x.date),nameOf('suppliers',x.sup),x.no,x.sum,x.note])));
  add('Подотчёт чеками',[['Дата','Сотрудник','Статья','Машина','Сумма','Чеки']].concat(DB.podc.map(x=>[dmy(x.date),nameOf('employees',x.emp),A(x.art).name,x.party?nameOf('cars',x.party):'',x.sum,x.note])));
  add('Продажи',[['Дата','Отгружено','Возвраты','Источник']].concat(DB.sales.slice().sort((a,b)=>a.date<b.date?-1:1).map(x=>[dmy(x.date),x.sum,x.ret,x.src])));
  add('Закрытие дней',[['День','По учёту','Пересчёт','Расхождение','Причина']].concat(Object.keys(DB.days).sort().map(k=>[dmy(k),DB.days[k].calc,DB.days[k].count,DB.days[k].diff,DB.days[k].why||''])));
  const f=repStart(), e=repEnd(), p=plCalc(f,e);
  const L=(k,n)=>Object.keys(p.lines).filter(id=>A(id).kind===k).map(id=>['  '+A(id).name,-p.lines[id]]);
  add('P&L '+S.month,[['Статья','Сумма'],['Отгружено',p.G],['Возвраты',-p.R],['НДС',-Math.round(p.vat)],['Выручка без НДС',Math.round(p.N0)],['Бонусы и акции',-p.bonus],['Чистая выручка',Math.round(p.net)],['Себестоимость',-Math.round(p.cogs)]]
    .concat(L('direct')).concat([['Зарплата агентов и доставщиков',-p.salD],['Валовая прибыль',Math.round(p.gross)],['Зарплата офиса',-p.salO],['Налоги с зарплаты',-p.ptax]]).concat(L('expense'))
    .concat([['Итого операционные расходы',-Math.round(p.opex)],['EBITDA',Math.round(p.ebitda)],['Прочие поступления',p.otherIn],['Прибыль до налога',Math.round(p.pbt)],['Налог на прибыль',-Math.round(p.ctax)],['Чистая прибыль',Math.round(p.np)]]));
  add('Журнал изменений',[['Когда','Что','Подробности']].concat(DB.log.map(l=>[new Date(l.at).toLocaleString('ru-RU'),l.what,l.detail])));
  XLSX.writeFile(wb,'Crafers Fin '+today()+'.xlsx');
}

document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]'); if(g){ go(g.getAttribute('data-go')); return; }
  const a=ev.target.closest('[data-act]'); if(!a) return;
  const act=a.getAttribute('data-act'), v=a.getAttribute('data-v'), id=a.getAttribute('data-id');
  switch(act){
    case 'more': $('#app').classList.add('more-open'); return;
    case 'more-close': $('#app').classList.remove('more-open'); return;
    case 'dir': S.form.dir=v; S.form.art=''; S.form.party=''; S.warn=null; break;
    case 'op-force': submitOp(true); return;
    case 'op-unwarn': S.warn=null; break;
    case 'op-clear': resetForm(); break;
    case 'op-cancel': resetForm(); break;
    case 'op-edit': { const o=DB.ops.find(x=>x.id===id); S.form={date:o.date,dir:o.dir,art:o.art,party:o.party,sum:String(o.sum),note:o.note,why:''}; S.editId=id; S.warn=null; render(false); return; }

    case 'op-del-no': S.delId=null; break;

      const why=($('#delreason')||{}).value||''; if(why.trim().length<3){ toast('Укажите причину удаления'); return; }
      const o=DB.ops.find(x=>x.id===id);
      if(dayClosed(o.date)||o.date<lastClosed()){ toast('День операции уже закрыт'); return; }
      if(o.sys){ toast('Запись пересчёта удаляется только открытием дня'); return; }
      if(o.dir==='in'&&firstNegative(DB.ops.filter(x=>x.id!==id))){ toast('Нельзя удалить приход: без него касса уйдёт в минус. Сначала исправьте расходы'); return; }
      if(A(o.art).kind==='pod_issue'&&podFirstNeg(o.party,DB.ops.filter(x=>x.id!==id),DB.podc)){ toast('Нельзя удалить выдачу: по ней уже закрыты чеки или есть возврат'); return; }

      DB.ops=DB.ops.filter(x=>x.id!==id); log('Удалена операция',dmy(o.date)+' · '+A(o.art).name+' · '+fmt(o.sum)+' · причина: '+why.trim()); S.delId=null; save(); toast('Операция удалена, причина записана'); break; }
    case 'inv-del': { const x=DB.inv.find(i=>i.id===id); if(dayClosed(x.date)||x.date<lastClosed()){ toast('День накладной закрыт'); return; } const why=(window.prompt('Причина удаления накладной')||'').trim(); if(why.length<3){ toast('Удаление отменено: нужна причина'); return; } DB.inv=DB.inv.filter(i=>i.id!==id); log('Удалена накладная',nameOf('suppliers',x.sup)+' №'+x.no+' · '+fmt(x.sum)+' · причина: '+why); save(); toast('Накладная удалена'); break; }
    case 'podc-del': { const x=DB.podc.find(i=>i.id===id); if(dayClosed(x.date)||x.date<lastClosed()){ toast('День закрыт'); return; } const why=(window.prompt('Причина удаления')||'').trim(); if(why.length<3){ toast('Удаление отменено: нужна причина'); return; } DB.podc=DB.podc.filter(i=>i.id!==id); log('Удалено закрытие подотчёта',nameOf('employees',x.emp)+' · '+fmt(x.sum)+' · причина: '+why); save(); toast('Запись удалена'); break; }

      try{ localStorage.removeItem(KEY); }catch(e){}
      DB=blank(); persist(); S.section='setup'; log('Данные удалены на этом компьютере','перед удалением скачана копия');
      toast('Данные удалены. Перед удалением скачана копия, файл копии не тронут'); render(false); return;
    default: return;
  }
  render(true);
});
document.addEventListener('input',ev=>{
  const el=ev.target;
  const ff=el.getAttribute('data-ff'); if(ff){ S.form[ff]=el.value; if(ff==='sum'){ const s=el.parentNode.querySelector('small'); const n=parseSum(el.value); if(s) s.textContent=isNaN(n)?'':fmt(n)+' сум'; else if(!isNaN(n)){ const sm=document.createElement('small'); sm.className='muted'; sm.textContent=fmt(n)+' сум'; el.parentNode.appendChild(sm); } } if(S.warn){ S.warn=null; const m=document.querySelector('#opform .msg'); if(m) m.remove(); } return; }
  const gf=el.getAttribute('data-gf'); if(gf){ S.gform[gf]=el.value; return; }
  const pf=el.getAttribute('data-pf'); if(pf){ S.pform[pf]=el.value; return; }
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.id==='month'){ S.month=el.value; render(false); return; }
  if(el.id==='emp-group'){ S.empGroup=el.value; return; }
  const gid=el.getAttribute('data-grp');
  if(gid){ const e=DB.employees.find(x=>x.id===gid), was=e.group; e.group=el.value; let n=0;
    DB.ops.forEach(o=>{ if(o.party===gid&&A(o.art).kind==='salary'&&!dayClosed(o.date)&&o.date>lastClosed()){ o.grp=el.value; n++; } });
    log('Группа сотрудника изменена',e.name+': '+(was==='direct'?'агент или доставщик':'офис')+' → '+(el.value==='direct'?'агент или доставщик':'офис')+'. Перенесено выплат в открытых днях: '+n+'; закрытые дни не меняются');
    save(); render(true); toast('Группа изменена. Выплат в открытых днях перенесено: '+n+'. Закрытые дни не меняются'); return; }
  if(el.hasAttribute('data-act-date')){ if(el.value){ if(el.value<DB.settings.startDate||el.value>today()){ toast('Дата вне периода учёта: с '+dmy(DB.settings.startDate)+' по сегодня'); el.value=S.date; return; } S.date=el.value; S.delId=null; render(true); } return; }
  if(el.id==='jart'){ S.jf.art=el.value; render(true); return; }
  if(el.id==='salesfile'&&el.files[0]){ readSalesFile(el.files[0]); return; }
  if(el.id==='restorefile'&&el.files[0]){
    const fname=el.files[0].name, rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!validCopy(d)) throw new Error('файл повреждён или это не копия Crafers Fin'); if(!window.confirm('Заменить данные на этом компьютере данными из файла? Текущие данные сначала скачаются копией.')) return; if(DB.ops.length||DB.inv.length||DB.sales.length) downloadCopy(); if(!Array.isArray(d.params)) d.params=[{from:'2000-01-01',salesVat:!!d.settings.salesVat,purchVat:!!d.settings.purchVat,vatRate:+d.settings.vatRate||12,ctax:+d.settings.ctax||15,cogsPct:+d.settings.cogsPct||80}]; DB=d; log('Данные открыты из копии',fname); persist(); render(false); toast('Данные открыты из копии'); }catch(e){ toast('Не удалось открыть копию: '+e.message); } el.value=''; }; rd.readAsText(el.files[0]); return; }
  if(el.hasAttribute('data-skiptot')&&S.imp){ S.imp.skipTotals=el.checked; render(true); return; }
  const mp=el.getAttribute('data-map'); if(mp){ S.imp.map[mp]=el.value; render(true); return; }
  const ff=el.getAttribute('data-ff'); if(ff&&el.tagName==='SELECT'){ S.form[ff]=el.value; if(ff==='art') S.form.party=''; S.warn=null; render(true); return; }
  if(ff==='date'){ S.form.date=el.value; return; }
  const gf=el.getAttribute('data-gf'); if(gf&&el.tagName==='SELECT'){ S.gform[gf]=el.value; render(true); return; }
  const pf=el.getAttribute('data-pf'); if(pf&&el.tagName==='SELECT'){ S.pform[pf]=el.value; if(pf==='art') S.pform.party=''; render(true); return; }
});
document.addEventListener('submit',ev=>{
  ev.preventDefault(); const f=ev.target;
  if(f.id==='opform') submitOp(false);
  else if(f.id==='gform') submitInv();
  else if(f.id==='pform') submitPodc();
  else if(f.id==='cform'){
    const cnt=parseSum(f.count.value), why=f.why.value.trim(), d=S.date, calc=cashAt(d);
    if(isNaN(cnt)||cnt<0){ toast('Введите сумму пересчёта'); return; }
    if(d>today()){ toast('Нельзя закрыть будущий день'); return; }
    if(d<DB.settings.startDate){ toast('День раньше начала учёта '+dmy(DB.settings.startDate)); return; }
    if(d<=lastClosed()){ toast('Уже закрыт '+dmy(lastClosed())+': закрывать можно только дни после него'); return; }
    const earlier=[...new Set(DB.ops.map(o=>o.date))].filter(x=>x<d&&!dayClosed(x)).sort();
    if(earlier.length){ toast('Сначала закройте '+dmy(earlier[0])+': дни закрываются по порядку'); return; }
    const diff=cnt-calc; if(diff&&why.length<3){ toast('Есть расхождение '+fmt(diff)+' сум: укажите причину'); return; }
    if(diff<0){ const neg=firstNegative(DB.ops.concat([{date:d,dir:'out',sum:-diff}])); if(neg){ toast('С недостачей '+fmt(-diff)+' касса уйдёт в минус на конец '+dmy(neg.d)+': '+fmt(neg.b)+'. Проверьте пересчёт и расходы после '+dmy(d)+'. День не закрыт'); return; } }
    DB.days[d]={closed:true,at:new Date().toISOString(),calc,count:cnt,diff,why};
    if(diff){ const adj={id:uid(),date:d,dir:diff<0?'out':'in',art:diff<0?'out_short':'in_surplus',party:'',sum:Math.abs(diff),note:'Пересчёт при закрытии дня'+(why?': '+why:''),created:new Date().toISOString(),sys:true}; DB.ops.push(adj); DB.days[d].adjId=adj.id;
      log(diff<0?'Недостача кассы':'Излишек кассы',dmy(d)+' · '+fmt(Math.abs(diff))+' · '+why); }
    log('День закрыт',dmy(d)+' · по учёту '+fmt(calc)+' · пересчёт '+fmt(cnt)+' · расхождение '+fmt(diff)); save();
    if(!(FH&&fhOk)) downloadCopy();
    render(true); toast(diff?'День закрыт с расхождением '+fmt(diff)+' сум':'День закрыт, касса сходится');
  }
  else if(f.id==='mform'){
    const d=f.d.value, s=parseSum(f.s.value), r=parseSum(f.r.value||0);
    if(!d||d<DB.settings.startDate||d>today()){ toast('Проверьте дату'); return; }
    if(!(s>=0)||!(r>=0)||(s===0&&r===0)){ toast('Проверьте суммы'); return; }
    if(DB.sales.some(x=>x.date===d)&&!window.confirm('За этот день продажи уже есть (в том числе из SalesDoc). Добавить ещё — будет двойной учёт, если это те же отгрузки. Продолжить?')) return;
    DB.sales.push({id:uid(),date:d,sum:s,ret:r,src:'вручную'}); log('Продажи вручную',dmy(d)+' · '+fmt(s-r)); S.manual=false; save(); render(true); toast('Продажи за '+dmy(d)+' добавлены');
  }
  else if(f.id==='sform'){
    const st=DB.settings, num=(n,min,max)=>{ const s=String(f[n].value).replace(/[\s\u00A0\u202F]/g,'').replace(',','.'); if(!/^\d+(\.\d+)?$/.test(s)) return null; const x=parseFloat(s); return isFinite(x)&&x>=min&&x<=max?x:null; };
    const vr=num('vatRate',0,50), ct=num('ctax',0,50), cp=num('cogsPct',0,100), bl=num('bigLimit',0,1e12);
    if([vr,ct,cp,bl].some(x=>x===null)){ toast('Проверьте числа в параметрах'); return; }
    if(!DB.ops.length&&f.startDate.value) st.startDate=f.startDate.value;
    const cur={vatRate:vr,ctax:ct,cogsPct:cp,salesVat:f.salesVat.value==='1',purchVat:f.purchVat.value==='1'};
    if(!(DB.ops.length||DB.sales.length||DB.inv.length)) DB.params=[Object.assign({from:'2000-01-01'},cur)];
    else { const from=today().slice(0,7)+'-01'; DB.params=DB.params.filter(x=>x.from<from).concat([Object.assign({from:from},cur)]); }
    Object.assign(st,cur,{bigLimit:Math.round(bl)});
    log('Параметры изменены','НДС '+vr+'%, прибыль '+ct+'%, себестоимость '+cp+'%, крупный от '+fmt(bl)); save(); render(true); toast('Параметры сохранены');
  }
  else if(f.id==='oform'){
    const old=DB.opening, O=JSON.parse(JSON.stringify(old)), bad=[];
    const LBL={cash:'касса',clients:'клиенты',goods:'товар',fixed:'основные средства',loans:'займы',vat:'НДС',ctax:'налог на прибыль'};
    const val=(n,label)=>{ const raw=f[n]?String(f[n].value).trim():''; const x=parseSum(raw===''?'0':raw); if(isNaN(x)){ bad.push(label); return 0; } return x; };
    Object.keys(LBL).forEach(n=>O[n]=val(n,LBL[n]));
    active('suppliers').forEach(s=>O.sup[s.id]=val('sup:'+s.id,s.name));
    active('employees').forEach(e=>O.pod[e.id]=val('pod:'+e.id,e.name));
    if(bad.length){ toast('Не число: '+bad.join(', ')+'. Пишите только цифры, например 20000000. Ничего не сохранено'); return; }
    if(O.cash<0||O.goods<0||O.clients<0||O.fixed<0||O.loans<0){ toast('Касса, товар, клиенты, основные средства и займы не могут быть отрицательными. Ничего не сохранено'); return; }
    if(Object.keys(O.pod).some(id=>O.pod[id]<0)){ toast('Подотчёт не может быть отрицательным. Ничего не сохранено'); return; }
    if(O.cash!==old.cash&&lastClosed()){ toast('Касса на начало не меняется после закрытия первого дня: иначе изменятся остатки закрытых дней. Ничего не сохранено'); return; }
    DB.opening=O; const neg=firstNegative(DB.ops), pneg=DB.employees.map(e=>podFirstNeg(e.id,DB.ops,DB.podc)).find(Boolean); DB.opening=old;
    if(neg){ toast('С такой кассой на начало остаток уйдёт в минус на конец '+dmy(neg.d)+'. Ничего не сохранено'); return; }
    if(pneg){ toast('С таким подотчётом на начало у сотрудника будет минус на '+dmy(pneg.d)+'. Ничего не сохранено'); return; }
    const done=ev.submitter&&ev.submitter.value==='done';
    if(done) O.done=true;
    const ch=Object.keys(LBL).filter(n=>old[n]!==O[n]).map(n=>LBL[n]+' '+fmt(old[n])+' → '+fmt(O[n]))
      .concat(Object.keys(O.sup).filter(id=>(+old.sup[id]||0)!==O.sup[id]).map(id=>nameOf('suppliers',id)+' '+fmt(+old.sup[id]||0)+' → '+fmt(O.sup[id])))
      .concat(Object.keys(O.pod).filter(id=>(+old.pod[id]||0)!==O.pod[id]).map(id=>'подотчёт '+nameOf('employees',id)+' '+fmt(+old.pod[id]||0)+' → '+fmt(O.pod[id])));
    DB.opening=O;
    log(done?'Вводный баланс утверждён':'Вводный баланс сохранён',ch.length?ch.join('; '):'без изменений сумм'); save(); render(true); toast(done?'Вводный баланс утверждён':'Черновик сохранён');
  }
});
window.addEventListener('storage',e=>{ if(e.key===KEY&&e.newValue){ reloadFromStore(); if(S.section==='opening'||S.section==='setup') toast('Данные изменились в другой вкладке. Работайте в одной вкладке'); else { render(true); toast('Данные обновлены из другой вкладки'); } } });
let OTHER_TAB=false;
try{ const bc=new BroadcastChannel('crafersfin'); bc.onmessage=e=>{ if(e.data==='ping') bc.postMessage('pong'); if(!OTHER_TAB){ OTHER_TAB=true; render(true); } }; bc.postMessage('ping'); }catch(e){}
window.addEventListener('popstate',()=>{ const k=location.hash.slice(1); if(VIEWS[k]){ S.section=k; render(false); } });

/* для проверки расчётов из консоли */
window.CF_APP={get DB(){ return DB; },plCalc,balance,cashAt,supBal,podBal,validateOp,firstNegative,podFirstNeg,parseSum,P,validCopy,guessMap};

const startK=location.hash.slice(1);
S.section=VIEWS[startK]?startK:(setupMissing().length&&!DB.ops.length?'setup':'cash');
render(false); initBackup();
})();
