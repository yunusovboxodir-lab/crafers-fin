<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17201C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crafers Fin">
<title>Crafers Fin — учёт для дистрибуции</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F2EC; --surface:#FFFFFF; --soft:#FAF9F5; --tint:#EAE6DA; --line:#E3E0D6; --line2:#EFECE3;
  --ink:#1B1D1A; --muted:#5E625B; --green:#1F5E4A; --green-soft:#E3EFE8; --amber:#D9A441;
  --amber-soft:#F5EAD6; --amber-ink:#7A4A12; --warn:#8A3B0A; --warn-soft:#F5E1D2; --side:#17201C;
  --font:'Onest','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* ---------- каркас ---------- */
.app{display:flex;height:100%;height:100dvh}
.side{width:248px;flex-shrink:0;background:var(--side);color:#fff;display:flex;flex-direction:column;gap:20px;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--amber);color:var(--side);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.brand b{display:block;font-size:17px}
.brand small{color:#93A39A;font-size:12px}
.side nav{display:flex;flex-direction:column;gap:2px}
.group{color:#7F8F86;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:12px 14px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:#B9C4BE;font-size:14px;font-weight:500;text-align:left}
.nav:hover{background:#26332D;color:#fff}
.nav.on{background:#2E4038;color:#fff;font-weight:600}
.nav svg,.tab svg{flex-shrink:0}
.pill{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--amber);color:var(--side);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.close{margin-top:auto;background:#212C27;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#B9C4BE}
.close b{color:#fff;font-size:14px}
.bar{height:6px;background:#33413A;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:64%;background:var(--amber)}

.body{flex:1;display:flex;flex-direction:column;min-width:0}
.top{min-height:64px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs{font-size:14px;color:var(--muted)}
.crumbs b{color:var(--ink)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;height:40px;width:250px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.search input{border:0;outline:0;background:transparent;font-size:14px;flex:1;min-width:0}
.chipbtn{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
main{flex:1;overflow:auto;padding:28px;-webkit-overflow-scrolling:touch}
.page{display:flex;flex-direction:column;gap:18px;max-width:1280px}

/* ---------- элементы ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:700;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:14px;font-weight:600}
.btn:hover{filter:brightness(.92)}
.btn.sm{height:34px;padding:0 12px;border-radius:8px;font-size:13px}
.btn.amber{background:var(--amber);color:var(--side)}
.ghost{height:44px;padding:0 16px;border:1px solid #D6D2C4;border-radius:10px;background:var(--surface);font-size:14px}
.ghost:hover{background:#ECE8DD}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:20px 22px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.kpi:hover{background:var(--soft)}
.kpi span:first-child{color:var(--muted);font-size:13px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.5px}
.kpi small{font-size:13px}
.kpi.dark{background:var(--green);color:#fff;border-color:var(--green)}
.kpi.dark span:first-child{color:#D8E6DE}
.seg{display:flex;background:var(--tint);border-radius:10px;padding:4px;gap:4px}
.seg button{height:36px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D6D2C4;background:#fff;font-size:13px;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--green-soft);color:var(--green)}
.b-wait{background:var(--amber-soft);color:var(--amber-ink)}
.b-bad{background:var(--warn-soft);color:var(--warn)}
.b-none{background:var(--line2);color:var(--muted)}

/* финансовые таблицы (P&L, ДДС) */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
table{border-collapse:collapse;width:100%}
.fin{min-width:760px;font-size:14px}
.fin th{background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:12px 16px;text-align:right;white-space:nowrap}
.fin th:first-child{text-align:left}
.fin td{padding:11px 16px;border-top:1px solid var(--line2);text-align:right;white-space:nowrap;background:#fff}
.fin td:first-child{text-align:left;white-space:normal;min-width:220px}
.fin th:first-child,.fin td:first-child{position:sticky;left:0;z-index:1}
.fin tr.indent td:first-child{padding-left:34px}
.fin tr.subt td{font-weight:600}
.fin tr.total td{background:#F1EEE5;font-weight:700}
.fin tr.grand td{background:var(--green);color:#fff;font-weight:700}
.fin tr.grand td.p{color:#D8E6DE}
.fin tr.hd td{background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:9px 16px}
.fin tr.link{cursor:pointer}
.fin tr.link:hover td{background:#F7F5EF}
.fin tr.link td:first-child::after{content:"  ›";color:var(--green);font-weight:700}
.fin td.p{color:var(--muted)}
.fin td.bad{color:var(--warn);font-weight:600}
.fin td.good{color:var(--green)}

/* списки (превращаются в карточки на телефоне) */
.list{font-size:14px}
.list th{background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:12px 16px;text-align:left;white-space:nowrap}
.list td{padding:13px 16px;border-top:1px solid var(--line2);vertical-align:middle}
.list .r{text-align:right}
.list tr.click{cursor:pointer}
.list tr.click:hover td{background:#F7F5EF}
.list .two small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.foot{display:flex;justify-content:flex-end;gap:16px;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft);font-size:14px;border-radius:0 0 14px 14px}

/* сводка */
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.chart{height:200px;display:flex;align-items:flex-end;gap:14px;padding:0 4px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;height:190px}
.chart .col i{display:block;width:min(26px,40%);border-radius:6px 6px 2px 2px}
.months{display:flex;gap:14px;padding:6px 4px 0}
.months span{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.meter{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--green)}
.task{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;border:0;border-top:1px solid var(--line2);background:#fff;text-align:left}
.task:hover{background:#F7F5EF}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.task .t{flex:1;display:flex;flex-direction:column;gap:2px}
.task .t small{color:var(--muted);font-size:13px}
.task .go{font-size:13px;color:var(--green);font-weight:600;white-space:nowrap}

.formula{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.formula span.f{padding:6px 12px;border-radius:8px;background:var(--tint)}
.formula span.f.res{background:var(--green);color:#fff;font-weight:600}

.form{border:1px solid var(--green)}
.fgrid{display:grid;grid-template-columns:1fr 1.4fr 180px;gap:14px}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
label.fld input{height:44px;padding:0 12px;border:1px solid #D6D2C4;border-radius:10px;font-size:16px;color:var(--ink);background:#fff;width:100%}
.expwrap{display:flex;gap:16px;align-items:flex-start}
.expwrap>.card:first-child{flex:1;min-width:0}
.limits{width:320px;flex-shrink:0}

.drop{border:2px dashed #C9C4B4;border-radius:14px;background:var(--soft);padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.file{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line2)}
.file:first-child{border-top:0}
.file.sel{background:var(--ground)}
.file .pick{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.xls{width:36px;height:36px;border-radius:8px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.map{display:grid;grid-template-columns:1fr 20px 1fr;gap:8px;align-items:center;font-size:14px}
.map .a{padding:9px 12px;border-radius:8px;background:var(--ground)}
.map .b{padding:9px 12px;border-radius:8px;border:1px solid #D6D2C4}

.toast{position:fixed;right:24px;bottom:24px;background:var(--side);color:#fff;padding:14px 18px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:10px;z-index:50;max-width:calc(100vw - 32px);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* нижняя навигация и «Ещё» — только телефон */
.tabs,.sheet,.scrim{display:none}

@media (max-width: 1100px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
  .expwrap{flex-direction:column}
  .limits{width:100%}
  .search{display:none}
}

@media (max-width: 760px){
  .side{display:none}
  .top{padding:0 16px;padding-top:env(safe-area-inset-top,0px);min-height:calc(56px + env(safe-area-inset-top,0px))}
  .top .chipbtn.org,.top .chipbtn.period{display:none}
  .crumbs{font-size:17px}
  .crumbs .path{display:none}
  main{padding:16px 14px calc(88px + env(safe-area-inset-bottom,0px))}
  h1{font-size:22px}
  .head{align-items:flex-start}
  .actions{width:100%}
  .actions .btn,.actions .ghost{flex:1}
  .actions .seg{width:100%}
  .actions .seg button{flex:1}
  .grid4{gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:20px}
  .fgrid{grid-template-columns:1fr}
  .pad{padding:16px}
  .toast{left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .map{font-size:13px}

  /* списки как карточки */
  .list thead{display:none}
  .list,.list tbody,.list tr,.list td{display:block;width:100%}
  .list tr{padding:12px 16px;border-top:1px solid var(--line2)}
  .list tr:first-child{border-top:0}
  .list td{border:0;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .list td::before{content:attr(data-label);color:var(--muted);font-size:13px;text-align:left}
  .list td.main{display:block;text-align:left;padding-bottom:6px;font-size:15px}
  .list td.main::before{display:none}
  .list td.hide-m{display:none}

  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:500;padding:6px 0;min-height:52px;position:relative}
  .tab.on{color:var(--green);font-weight:700}
  .tab .pill{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;font-size:11px}
  .scrim{position:fixed;inset:0;background:rgba(23,32,28,.4);z-index:45}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:46;background:#fff;border-radius:18px 18px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:2px}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
  .sheet .nav{color:var(--ink);height:52px;font-size:16px}
  .sheet .nav.on{background:var(--green-soft);color:var(--green)}
  .more-open .scrim{display:block}
  .more-open .sheet{display:flex}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="logo">CF</div><div><b>Crafers Fin</b><small>Учёт для дистрибуции</small></div></div>
    <nav id="sidenav" aria-label="Разделы"></nav>
    <div class="close"><span>Закрытие месяца</span><b>Сентябрь 2026</b><div class="bar"><i></i></div><span>7 из 11 шагов выполнено</span></div>
  </aside>
  <div class="body">
    <header class="top">
      <div class="crumbs"><span class="path">Crafers Fin / </span><b id="crumb">Сводка</b></div>
      <div class="spacer"></div>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E625B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input aria-label="Поиск" placeholder="Поиск статей, сотрудников"></label>
      <button class="chipbtn period" type="button">Сентябрь 2026</button>
      <button class="chipbtn org" type="button">Crafers · все филиалы</button>
      <div class="avatar">БХ</div>
    </header>
    <main id="main"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <div class="scrim" data-act="more-close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Другие разделы"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var ICONS = {

  salary:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M17 5.5a3 3 0 010 5.5M19 14.8c1.4.8 2.3 2.4 2.6 4.7"/>',
  ship:'<path d="M2 6h12v10H2zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',

    return '<tr><td class="main two"><b style="font-weight:600">'+esc(e.who)+'</b>'+(e.role?' <span class="muted" style="font-size:13px">· '+esc(e.role)+'</span>':'')+'<small>'+esc(e.desc)+'</small></td>'+
      '<td data-label="Дата">'+e.date+'</td><td data-label="Статья">'+esc(e.cat)+'</td>'+
      '<td class="r num" data-label="Сумма, сум"><b style="font-weight:600">'+fmt(e.sum)+'</b></td>'+
      '<td class="r" data-label="Статус">'+(e.pending?'<button class="btn sm amber" data-act="approve" data-id="'+e.id+'">Утвердить</button>':'<span class="badge b-ok">Утверждён</span>')+'</td></tr>';
  }).join('');
  var form=S.showForm?
    '<div class="card pad form" style="display:flex;flex-direction:column;gap:14px"><b style="font-size:16px">Новый расход: '+(tr?'дорожные и ГСМ':'прочие')+'</b>'+
    '<div class="fgrid"><label class="fld">'+(tr?'Сотрудник':'Контрагент')+'<input data-f="who" value="'+esc(S.form.who)+'" placeholder="Например, Юсупов Д." autocomplete="off"></label>'+
    '<label class="fld">Описание<input data-f="desc" value="'+esc(S.form.desc)+'" placeholder="Маршрут, цель поездки или назначение" autocomplete="off"></label>'+
    '<label class="fld">Сумма, сум<input data-f="sum" value="'+esc(S.form.sum)+'" inputmode="numeric" placeholder="0" autocomplete="off"></label></div>'+
    '<div style="display:flex;flex-direction:column;gap:8px"><span class="muted" style="font-size:13px">Статья</span><div class="chips">'+cats.map(function(c){return '<button class="chip'+(S.form.cat===c?' on':'')+'" data-act="cat" data-v="'+c+'">'+c+'</button>';}).join('')+'</div></div>'+
    '<div class="actions" style="justify-content:flex-end"><button class="ghost" style="border-style:dashed;margin-right:auto">Фото чека</button><button class="ghost" data-act="exp-cancel">Отмена</button><button class="btn" data-act="exp-save">Отправить на утверждение</button></div></div>':'';
  var lim=tr?'<div class="card pad limits" style="display:flex;flex-direction:column;gap:14px"><div><b style="font-size:16px">Лимиты на месяц</b><div class="sub" style="margin-top:2px">ГСМ и дорожные по сотрудникам</div></div>'+
    LIMITS.map(function(l){ var p=l[1]/l[2], ov=p>1;
      return '<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+l[0]+'</span><span style="font-size:13px;font-weight:600;color:'+(ov?'var(--warn)':'var(--muted)')+'">'+(ov?'превышен, ':'')+pct(p)+'</span></div><div class="meter"><i style="width:'+Math.min(100,Math.round(p*100))+'%;background:'+(ov?'#C0621F':'var(--green)')+'"></i></div><div class="num muted" style="font-size:12px">'+fmt(l[1])+' / '+fmt(l[2])+'</div></div>';
    }).join('')+'</div>':'';
  return '<div class="page">'+
    head('Расходы','Авансовые отчёты торговых и водителей, прочие расходы за сентябрь','<button class="btn" data-act="exp-new">+ Добавить расход</button>')+
    '<div class="chips"><button class="chip'+(tr?' on':'')+'" data-act="tab-travel">Дорожные и ГСМ</button><button class="chip'+(!tr?' on':'')+'" data-act="tab-other">Прочие расходы</button></div>'+
    form+
    '<div class="expwrap"><div class="card" style="overflow:hidden"><table class="list"><thead><tr><th>'+(tr?'Сотрудник и описание':'Контрагент и назначение')+'</th><th>Дата</th><th>Статья</th><th class="r">Сумма, сум</th><th class="r">Статус</th></tr></thead><tbody>'+rows+'</tbody></table><div class="foot"><span class="muted">Итого:</span><b class="num">'+fmt(total)+'</b></div></div>'+lim+'</div></div>';
}

function vSalary(){
  var s={g:0,n:0,p:0,c:0};
  var rows=EMPS.filter(function(e){return S.dept==='all'||e[2]===S.dept;}).map(function(e){
    var pl=e[5], rate=pl===null?0:pl>=100?0.3:pl>=90?0.15:0, bonus=e[4]*rate, g=e[4]+bonus, n=g*0.12, p=g-n;
    s.g+=g; s.n+=n; s.p+=p; s.c++;
    var cls=pl===null?'b-none':pl>=100?'b-ok':pl>=90?'b-wait':'b-bad';
    return '<tr class="click"><td class="main two"><b style="font-weight:600">'+e[0]+'</b><small>'+e[1]+'</small></td>'+
      '<td data-label="Филиал">'+e[3]+'</td><td class="r num" data-label="Оклад">'+fmt(e[4])+'</td>'+
      '<td class="r" data-label="План"><span class="badge '+cls+'">'+(pl===null?'—':pl+'%')+'</span></td>'+
      '<td class="r num" data-label="Бонус" style="color:var(--green)">'+(bonus?fmt(bonus):'—')+'</td>'+
      '<td class="r num muted" data-label="НДФЛ 12%">'+fmt(n)+'</td>'+
      '<td class="r num" data-label="К выплате"><b>'+fmt(p)+'</b></td></tr>';
  }).join('');
  var cards=[['Сотрудников',String(s.c)],['Начислено',fmt(s.g)],['НДФЛ 12%',fmt(s.n)],['К выплате',fmt(s.p),1]].map(function(k){
    return '<div class="kpi'+(k[2]?' dark':'')+'"><span>'+k[0]+'</span><span class="v num" style="font-size:22px">'+k[1]+'</span></div>';
  }).join('');
  return '<div class="page">'+
    head('Расчётная ведомость, сентябрь','Оклад + бонус за выполнение плана, НДФЛ 12%','<button class="ghost">Правила бонусов</button><button class="btn" data-act="salary-run">Рассчитать и провести</button>')+
    '<div class="grid4">'+cards+'</div>'+
    '<div class="chips">'+DEPTS.map(function(d){return '<button class="chip'+(S.dept===d[0]?' on':'')+'" data-act="dept" data-v="'+d[0]+'">'+d[1]+'</button>';}).join('')+'</div>'+
    '<div class="card" style="overflow:hidden"><table class="list"><thead><tr><th>Сотрудник</th><th>Филиал</th><th class="r">Оклад</th><th class="r">План</th><th class="r">Бонус</th><th class="r">НДФЛ</th><th class="r">К выплате</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function vShip(){
  if(S.doc!==null) return vDoc();
  var rows=SALES.map(function(d,i){
    var done=d[5]||!!S.posted[d[0]];
    return '<tr class="click" data-act="doc" data-i="'+i+'"><td class="main"><b class="num" style="font-weight:600">'+d[0]+'</b> · '+d[2]+'</td>'+
      '<td data-label="Дата">'+d[1]+'</td><td data-label="Филиал">'+d[3]+'</td>'+
      '<td class="r num" data-label="Сумма, сум"><b style="font-weight:600">'+fmt(d[4])+'</b></td>'+
      '<td class="r" data-label="Статус"><span class="badge '+(done?'b-ok':'b-wait')+'">'+(done?'Проведена':'Черновик')+'</span></td></tr>';
  }).join('');
  return '<div class="page">'+
    head('Отгрузки клиентам','Проведённые отгрузки сразу попадают в выручку и себестоимость P&L','<button class="btn" data-act="doc-new">+ Отгрузка</button>')+
    '<div class="card" style="overflow:hidden"><table class="list"><thead><tr><th>Номер и клиент</th><th>Дата</th><th>Филиал</th><th class="r">Сумма, сум</th><th class="r">Статус</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function vDoc(){
  var isNew=S.doc==='new', d=isNew?['ОТ-00129','25.09.2026','','Ташкент']:SALES[S.doc];
  var r=0,c=0;
  var rows=LINES.map(function(l,i){ var sum=l[1]*l[2], cost=l[1]*l[3]; r+=sum; c+=cost;
    return '<tr><td class="main">'+(i+1)+'. '+l[0]+'</td><td class="r num" data-label="Кол-во">'+fmt(l[1])+'</td><td class="r num" data-label="Цена">'+fmt(l[2])+'</td><td class="r num muted" data-label="Себестоимость">'+fmt(l[3])+'</td><td class="r num" data-label="Сумма"><b>'+fmt(sum)+'</b></td><td class="r num" data-label="Маржа" style="color:var(--green)">'+pct((l[2]-l[3])/l[2])+'</td></tr>';
  }).join('');
  var fld=function(lbl,v){ return '<label class="fld">'+lbl+'<input value="'+esc(v)+'"></label>'; };
  return '<div class="page">'+
    '<div class="head"><div style="display:flex;align-items:center;gap:12px"><button class="ghost" data-act="doc-close" aria-label="Назад к списку" style="width:44px;padding:0;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><div><h1>Отгрузка '+d[0]+'</h1><div class="sub">от '+d[1]+'</div></div></div>'+
    '<div class="actions"><button class="ghost" data-act="doc-close">Записать</button><button class="btn" data-act="doc-post">Провести и закрыть</button></div></div>'+
    '<div class="card pad fgrid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+fld('Клиент',d[2])+fld('Торговый представитель','Юсупов Д.')+fld('Филиал',d[3])+fld('Дата',d[1])+'</div>'+
    '<div class="card" style="overflow:hidden"><table class="list"><thead><tr><th>SKU</th><th class="r">Кол-во</th><th class="r">Цена</th><th class="r">Себест.</th><th class="r">Сумма</th><th class="r">Маржа</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="card pad" style="align-self:flex-end;width:min(380px,100%);display:flex;flex-direction:column;gap:10px;font-size:14px"><div style="display:flex;justify-content:space-between"><span class="muted">Выручка</span><span class="num">'+fmt(r)+'</span></div><div style="display:flex;justify-content:space-between"><span class="muted">Себестоимость</span><span class="num">'+fmt(c)+'</span></div><div style="height:1px;background:var(--line)"></div><div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700"><span>Валовая прибыль</span><span class="num">'+fmt(r-c)+'</span></div></div></div>';
}

function vImp(){
  var files=FILES.map(function(f,i){ var done=!!S.files[i];
    return '<div class="file'+(S.selFile===i?' sel':'')+'"><button class="pick" data-act="file-sel" data-i="'+i+'"><span class="xls">XLS</span><span style="min-width:0"><span style="display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis">'+esc(f.name)+'</span><small class="muted" style="font-size:13px">'+f.meta+' → '+f.target+'</small></span></button>'+
      (done?'<span class="badge b-ok">Загружен</span>':'<button class="btn sm" data-act="file-run" data-i="'+i+'">Загрузить</button>')+'</div>';
  }).join('');
  var sel=FILES[S.selFile];
  var map=sel.map.map(function(m){ return '<div class="map"><span class="a">'+m[0]+'</span><span class="muted" style="text-align:center">→</span><span class="b">'+m[1]+'</span></div>'; }).join('');
  return '<div class="page">'+
    head('Переезд из Excel','Загрузите текущие таблицы: система разложит данные по разделам и запомнит шаблон')+
    '<div class="expwrap"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:16px">'+
    '<div class="drop">'+icon('imp',34)+'<b style="font-size:16px">Выберите или перетащите файлы .xlsx</b><span class="muted" style="font-size:14px">P&amp;L, ДДС, дорожные, ведомости ЗП, себестоимость</span><button class="btn">Выбрать файлы</button></div>'+
    '<div class="card" style="overflow:hidden">'+files+'</div></div>'+
    '<div class="card pad limits" style="width:420px;display:flex;flex-direction:column;gap:12px"><div><b style="font-size:16px">Сопоставление колонок</b><div class="sub" style="margin-top:2px">'+esc(sel.name)+'</div></div>'+
    '<div class="map muted" style="font-size:12px;font-weight:600"><span>В Excel</span><span></span><span>В системе</span></div>'+map+
    '<div class="muted" style="font-size:13px;padding-top:8px;border-top:1px solid var(--line2)">Шаблон сохранится: следующий файл того же вида загрузится без настройки.</div></div></div></div>';
}

/* ================= навигация ================= */
var VIEWS={desk:vDesk,pl:vPl,dds:vDds,cost:vCost,exp:vExp,salary:vSalary,ship:vShip,imp:vImp};
var TABS=['desk','pl','dds','exp'];
var MORE=['cost','salary','ship','imp'];

function renderNav(){
  var p=pending();
  var pill=function(k){ return k==='exp'&&p?'<span class="pill">'+p+'</span>':''; };
  var btn=function(k){ return '<button class="nav'+(S.section===k?' on':'')+'" data-go="'+k+'">'+icon(k)+TITLES[k]+pill(k)+'</button>'; };
  document.getElementById('sidenav').innerHTML='<div class="group">Финансы</div>'+['desk','pl','dds','cost','exp','salary'].map(btn).join('')+'<div class="group">Операции</div>'+['ship','imp'].map(btn).join('');
  var inMore=MORE.indexOf(S.section)!==-1;
  document.getElementById('tabs').innerHTML=TABS.map(function(k){
    var short={desk:'Сводка',pl:'P&L',dds:'Деньги',exp:'Расходы'}[k];
    return '<button class="tab'+(S.section===k?' on':'')+'" data-go="'+k+'">'+icon(k,22)+short+pill(k)+'</button>';
  }).join('')+'<button class="tab'+(inMore?' on':'')+'" data-act="more">'+icon('more',22)+'Ещё</button>';
  document.getElementById('sheet').innerHTML='<div class="grab"></div>'+MORE.map(btn).join('');
}
function render(keepScroll){
  var m=document.getElementById('main'), y=m.scrollTop;
  m.innerHTML=VIEWS[S.section]();
  document.getElementById('crumb').textContent=TITLES[S.section];
  document.title='Crafers Fin · '+TITLES[S.section];
  renderNav();
  m.scrollTop=keepScroll?y:0;
}
function go(k){
  document.getElementById('app').classList.remove('more-open');
  if(k==='dds-plan'){ S.ddsView='plan'; k='dds'; }
  S.section=k; S.doc=null; S.showForm=false;
  try{ if(location.hash!=='#'+k) history.pushState(null,'','#'+k); }catch(e){}
  render(false);
}
var tt;
function toast(t){
  var el=document.getElementById('toast');
  el.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="2.2" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>'+esc(t);
  el.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){el.classList.remove('show');},2600);
}

document.addEventListener('click',function(ev){
  var g=ev.target.closest('[data-go]'); if(g){ go(g.getAttribute('data-go')); return; }
  var a=ev.target.closest('[data-act]'); if(!a) return;
  var act=a.getAttribute('data-act'), v=a.getAttribute('data-v'), i=a.getAttribute('data-i');
  switch(act){
    case 'more': document.getElementById('app').classList.add('more-open'); return;
    case 'more-close': document.getElementById('app').classList.remove('more-open'); return;
    case 'pl-month': S.plView='month'; break;
    case 'pl-region': S.plView='region'; break;
    case 'dds-fact': S.ddsView='fact'; break;
    case 'dds-plan': S.ddsView='plan'; break;
    case 'tab-travel': S.expTab='travel'; S.form.cat='ГСМ'; break;
    case 'tab-other': S.expTab='other'; S.form.cat='Связь'; break;
    case 'cat': S.form.cat=v; break;
    case 'exp-new': if(S.section!=='exp'){ S.section='exp'; try{ history.pushState(null,'','#exp'); }catch(e){} } S.showForm=true; render(false); return;
    case 'exp-cancel': S.showForm=false; break;
    case 'exp-save':
      var amt=parseInt(String(S.form.sum).replace(/\D/g,''),10)||0;
      S.expenses.unshift({id:Date.now(),type:S.expTab,date:'25.09',who:S.form.who||'Без имени',role:'',desc:S.form.desc||'—',cat:S.form.cat,sum:amt,pending:true});
      S.form={who:'',desc:'',sum:'',cat:S.form.cat}; S.showForm=false; render(true); toast('Расход отправлен на утверждение'); return;
    case 'approve':
      S.expenses.forEach(function(e){ if(String(e.id)===a.getAttribute('data-id')) e.pending=false; });
      render(true); toast('Расход утверждён и попал в P&L'); return;
    case 'dept': S.dept=v; break;
    case 'salary-run': toast('Ведомость рассчитана, ФОТ отражён в P&L и ДДС'); return;
    case 'doc': S.doc=+i; render(false); return;
    case 'doc-new': S.doc='new'; render(false); return;
    case 'doc-close': S.doc=null; render(false); return;
    case 'doc-post':
      var no=S.doc==='new'?'ОТ-00129':SALES[S.doc][0]; if(S.doc!=='new') S.posted[no]=true;
      S.doc=null; render(false); toast('Отгрузка '+no+' проведена'); return;
    case 'file-sel': S.selFile=+i; break;
    case 'file-run': S.files[+i]=true; S.selFile=+i; render(true); toast(FILES[+i].name+' загружен в раздел «'+FILES[+i].target+'»'); return;
    default: return;
  }
  render(true);
});
document.addEventListener('input',function(ev){
  var f=ev.target.getAttribute && ev.target.getAttribute('data-f');
  if(f) S.form[f]=ev.target.value;
});
window.addEventListener('popstate',function(){
  var k=location.hash.slice(1); if(VIEWS[k]){ S.section=k; S.doc=null; S.showForm=false; render(false); }
});

var start=location.hash.slice(1); if(VIEWS[start]) S.section=start;
render(false);
})();
</script>
</body>
</html>
